<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadPulse | Golden AI Core</title>
    
    <!-- Fonts & External CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    
    <!-- External JS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                extend: {
                    colors: {
                        background: '#030303', 
                        surface: '#0d0d0d',
                        gold: { 
                            300: '#fde047', 
                            400: '#facc15', 
                            500: '#eab308', 
                            600: '#ca8a04', 
                            primary: '#d4af37' 
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <style>
        body { background-color: #030303; color: #ededed; overflow-x: hidden; }
        
        /* Premium Tech Grid Background */
        .tech-grid {
            position: fixed; inset: 0; z-index: -2;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        .orbit-container {
            position: fixed; top: 50%; left: 50%; width: 100vw; height: 100vh;
            transform: translate(-50%, -50%); z-index: -1; overflow: hidden;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
        }
        .orbit {
            position: absolute; top: 50%; left: 50%; border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.15); transform: translate(-50%, -50%);
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: translate(-50%, -50%) rotate(360deg); } 100% { transform: translate(-50%, -50%) rotate(0deg); } }
        
        .orbit-1 { width: 60vmin; height: 60vmin; animation: spin 40s linear infinite; }
        .orbit-2 { width: 90vmin; height: 90vmin; animation: spin-reverse 55s linear infinite; border: 1px dashed rgba(212, 175, 55, 0.1); }
        .orbit-3 { width: 130vmin; height: 130vmin; animation: spin 70s linear infinite; }

        .node {
            position: absolute; top: 0; left: 50%; width: 40px; height: 40px; margin-left: -20px; margin-top: -20px;
            background: #0d0d0d; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3), inset 0 0 10px rgba(212, 175, 55, 0.1);
        }
        .orbit-1 .node { animation: spin-reverse 40s linear infinite; }
        .orbit-2 .node { animation: spin 55s linear infinite; }
        .orbit-3 .node { animation: spin-reverse 70s linear infinite; }

        .glass-core {
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 0 60px rgba(212, 175, 55, 0.1), inset 0 0 20px rgba(212, 175, 55, 0.05);
        }
        
        /* HUD Vertical Text */
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; }

        .leaflet-container { background: #0a0a0a; font-family: 'Plus Jakarta Sans', sans-serif; }
        .leaflet-popup-content-wrapper { background: #111; color: #d4af37; border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; }
        .leaflet-popup-tip { background: #111; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 lg:p-8 relative selection:bg-gold-500 selection:text-black">
    
    <!-- Premium Grid Background -->
    <div class="tech-grid"></div>

    <!-- Background Animations -->
    <div class="orbit-container">
        <div class="orbit orbit-1">
            <div class="node" style="top: 15%; left: 85%;"><i data-lucide="cpu" class="w-4 h-4 text-gold-primary"></i></div>
            <div class="node" style="top: 85%; left: 15%;"><i data-lucide="camera" class="w-4 h-4 text-gold-primary"></i></div>
        </div>
        <div class="orbit orbit-2">
            <div class="node" style="top: 50%; left: 0%;"><i data-lucide="database" class="w-4 h-4 text-gold-primary"></i></div>
            <div class="node" style="top: 50%; left: 100%;"><i data-lucide="satellite" class="w-4 h-4 text-gold-primary"></i></div>
        </div>
        <div class="orbit orbit-3">
            <div class="node" style="top: 20%; left: 20%;"><i data-lucide="shield-check" class="w-4 h-4 text-gold-primary"></i></div>
            <div class="node" style="top: 80%; left: 80%;"><i data-lucide="globe" class="w-4 h-4 text-gold-primary"></i></div>
        </div>
    </div>

    <!-- Left HUD Panel -->
    <div class="hidden xl:flex fixed left-8 top-1/2 -translate-y-1/2 h-[75vh] flex-col justify-between items-center z-0 opacity-60">
        <div class="w-[1px] h-32 bg-gradient-to-b from-transparent to-gold-primary"></div>
        <div class="vertical-text text-[10px] font-mono tracking-[0.4em] text-gold-primary my-4 rotate-180 uppercase">Sys.Core.Node.01</div>
        <div class="flex flex-col gap-3 my-4">
            <span class="w-1.5 h-1.5 bg-gold-primary rounded-full animate-ping"></span>
            <span class="w-1.5 h-1.5 bg-gold-primary/40 rounded-full"></span>
            <span class="w-1.5 h-1.5 bg-gold-primary/40 rounded-full"></span>
            <span class="w-1.5 h-1.5 bg-gold-primary/40 rounded-full"></span>
        </div>
        <div class="w-[1px] h-32 bg-gradient-to-t from-transparent to-gold-primary"></div>
    </div>

    <!-- Right HUD Panel -->
    <div class="hidden xl:flex fixed right-8 top-1/2 -translate-y-1/2 h-[75vh] flex-col justify-between items-center z-0 opacity-60">
        <div class="w-[1px] h-32 bg-gradient-to-b from-transparent to-gold-primary"></div>
        <div class="flex flex-col gap-1 my-4">
            <div class="w-4 h-[1px] bg-gold-primary/60"></div>
            <div class="w-2 h-[1px] bg-gold-primary/60"></div>
            <div class="w-4 h-[1px] bg-gold-primary/60"></div>
        </div>
        <div class="vertical-text text-[10px] font-mono tracking-[0.4em] text-gold-primary my-4 uppercase">Data Stream Active</div>
        <div class="w-[1px] h-32 bg-gradient-to-t from-transparent to-gold-primary"></div>
    </div>

    <!-- Navigation Header -->
    <div class="w-full max-w-5xl flex flex-col sm:flex-row justify-between items-center mb-6 z-20 gap-4">
        <div class="flex items-center gap-3 bg-black/60 border border-gold-primary/20 px-4 py-2 rounded-full backdrop-blur-sm">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_10px_#10b981]"></span>
            <span class="text-xs font-mono text-gold-primary uppercase tracking-widest">System Operational</span>
        </div>
        <div class="flex gap-3">
            <a href="track.html" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gold-primary/40 bg-black/80 backdrop-blur-md text-gold-primary text-xs font-bold uppercase tracking-wider hover:bg-gold-primary hover:text-black transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)]">
                <i data-lucide="search" class="w-4 h-4"></i> Track Report
            </a>
            <a href="dashboard.html" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gold-primary/40 bg-black/80 backdrop-blur-md text-gold-primary text-xs font-bold uppercase tracking-wider hover:bg-gold-primary hover:text-black transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)]">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Admin Panel
            </a>
            <a href="contractor.html" class="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gold-primary/40 bg-black/80 backdrop-blur-md text-gold-primary text-xs font-bold uppercase tracking-wider hover:bg-gold-primary hover:text-black transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)]">
                <i data-lucide="hard-hat" class="w-4 h-4"></i> Contractor Portal
            </a>
        </div>
    </div>

    <!-- Main Content Core -->
    <main class="w-full max-w-5xl glass-core rounded-[2rem] p-6 lg:p-10 relative z-10 overflow-hidden transform transition-all duration-500 hover:scale-[1.01]">
        
        <header class="text-center mb-10 relative">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 bg-gold-primary/10 blur-[60px] rounded-full z-[-1]"></div>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-2">
                Road<span class="text-transparent bg-clip-text bg-gradient-to-r from-gold-300 to-gold-600">Pulse</span> AI
            </h1>
            <p class="text-xs text-gold-primary/80 font-bold tracking-[0.2em] uppercase">Core Processing Node</p>
        </header>

        <div class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- Visual Feed Upload -->
                <div class="flex flex-col gap-3">
                    <label class="text-xs font-bold text-gold-primary uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="scan" class="w-4 h-4"></i> Visual Feed
                    </label>
                    <div class="relative w-full group">
                        <label for="image-input" class="flex flex-col items-center justify-center w-full h-[320px] border border-gold-primary/30 hover:border-gold-primary bg-black/50 hover:bg-black/80 rounded-2xl cursor-pointer transition-all duration-300 overflow-hidden relative shadow-inner">
                            <div id="upload-placeholder" class="flex flex-col items-center justify-center pt-5 pb-6">
                                <div class="w-16 h-16 rounded-full bg-gold-primary/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-500 shadow-[0_0_20px_rgba(212,175,55,0.2)]">
                                    <i data-lucide="focus" class="w-8 h-8 text-gold-primary"></i>
                                </div>
                                <p class="text-sm font-bold text-gray-300">Initialize Visual Upload</p>
                                <p class="text-xs text-gray-500 mt-2 font-mono">JPEG / PNG</p>
                            </div>
                            <img id="image-preview" class="absolute inset-0 w-full h-full object-cover hidden" />
                            <canvas id="overlay-canvas" class="absolute inset-0 w-full h-full hidden pointer-events-none"></canvas>
                        </label>
                        <input id="image-input" type="file" accept="image/*" class="hidden" />
                    </div>
                </div>

                <!-- Geo-Spatial Map -->
                <div class="flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-gold-primary uppercase tracking-widest flex items-center gap-2">
                            <i data-lucide="crosshair" class="w-4 h-4"></i> Geo-Spatial Link
                        </label>
                        <div class="flex items-center gap-1.5 text-[10px] text-gold-primary/90 font-mono bg-black/60 px-3 py-1.5 rounded-md border border-gold-primary/30">
                            <span id="coords-display">Awaiting Signal...</span>
                        </div>
                    </div>
                    <div class="w-full h-[320px] rounded-2xl overflow-hidden border border-gold-primary/30 relative bg-black">
                        <div id="map" class="w-full h-full"></div>
                        <div id="loc-loading" class="absolute inset-0 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center z-[400]">
                            <div class="relative w-12 h-12 flex items-center justify-center mb-4">
                                <span class="absolute inset-0 border-2 border-gold-primary border-t-transparent rounded-full animate-spin"></span>
                                <i data-lucide="satellite-dish" class="w-5 h-5 text-gold-primary animate-pulse"></i>
                            </div>
                            <span class="text-xs text-gold-primary font-mono tracking-widest uppercase">Locking Coordinates...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dynamic Buttons Section -->
            <div class="space-y-4 pt-4">
                <button type="button" id="submit-btn" class="w-full bg-gradient-to-r from-gold-600 via-gold-500 to-gold-400 hover:from-gold-500 hover:to-gold-300 text-black font-extrabold text-sm tracking-[0.15em] uppercase py-4.5 px-6 rounded-xl shadow-[0_0_25px_rgba(212,175,55,0.4)] transition-all flex justify-center items-center gap-3">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                    Engage AI Analysis
                </button>
                
                <!-- Download Button (Hidden by default) -->
                <button type="button" id="download-btn" class="hidden w-full bg-black/80 hover:bg-black border border-gold-primary/60 text-gold-primary font-bold text-sm tracking-widest uppercase py-4 px-6 rounded-xl transition-all shadow-[0_0_15px_rgba(212,175,55,0.2)] flex justify-center items-center gap-3">
                    <i data-lucide="file-down" class="w-5 h-5"></i>
                    Download Official Receipt
                </button>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="result-toast" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 translate-y-24 opacity-0 transition-all duration-500 bg-black/95 border px-6 py-4 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] flex items-center gap-4 w-[90%] max-w-md z-50 backdrop-blur-md">
            <div id="toast-icon" class="mt-0.5"></div>
            <div>
                <h4 id="toast-title" class="text-sm font-bold text-white uppercase tracking-wider"></h4>
                <p id="toast-msg" class="text-xs text-gray-400 mt-1 font-mono leading-relaxed"></p>
            </div>
        </div>
    </main>

    <!-- Scripts Integration -->
    <script>lucide.createIcons();</script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let map, marker, userLat = null, userLon = null;
        let globalReportData = null;
        let selectedFile = null;

        // Initialize Map
        map = L.map('map', { zoomControl: false }).setView([26.2183, 78.1828], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);

        // Fetch User Location
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude; userLon = pos.coords.longitude;
                    map.setView([userLat, userLon], 16);
                    const goldIcon = L.divIcon({
                        className: 'bg-gold-500 w-4 h-4 rounded-full border-2 border-black shadow-[0_0_15px_rgba(212,175,55,0.9)]',
                        iconSize: [16, 16], iconAnchor: [8, 8]
                    });
                    marker = L.marker([userLat, userLon], {icon: goldIcon}).addTo(map);
                    document.getElementById('coords-display').innerText = `${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;
                    document.getElementById('loc-loading').style.opacity = '0';
                    setTimeout(() => document.getElementById('loc-loading').style.display = 'none', 300);
                },
                (err) => {
                    document.getElementById('coords-display').innerText = "GPS_DENIED";
                    document.getElementById('loc-loading').innerHTML = `<i data-lucide="map-pin-off" class="w-6 h-6 text-red-500 mb-2"></i><span class="text-xs text-red-500 font-mono">Location Blocked</span>`;
                    lucide.createIcons();
                }
            );
        }

        // Image Handling
        const imageInput = document.getElementById('image-input');
        const imagePreview = document.getElementById('image-preview');
        const placeholder = document.getElementById('upload-placeholder');
        const canvas = document.getElementById('overlay-canvas');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    canvas.classList.add('hidden');
                    document.getElementById('download-btn').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Toast Notification System
        function showToast(type, title, msg) {
            const toast = document.getElementById('result-toast');
            const iconWrap = document.getElementById('toast-icon');
            
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'success') {
                iconWrap.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6 text-gold-500"></i>`;
                toast.className = "absolute bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-500 bg-black/95 border border-gold-500/50 px-6 py-4 rounded-xl shadow-[0_0_30px_rgba(212,175,55,0.2)] flex items-start gap-4 w-[90%] max-w-md z-50 backdrop-blur-md";
            } else if (type === 'merge') {
                iconWrap.innerHTML = `<i data-lucide="git-merge" class="w-6 h-6 text-blue-400"></i>`;
                toast.className = "absolute bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-500 bg-black/95 border border-blue-500/50 px-6 py-4 rounded-xl shadow-[0_0_30px_rgba(59,130,246,0.2)] flex items-start gap-4 w-[90%] max-w-md z-50 backdrop-blur-md";
            } else {
                iconWrap.innerHTML = `<i data-lucide="alert-triangle" class="w-6 h-6 text-red-500"></i>`;
                toast.className = "absolute bottom-6 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 transition-all duration-500 bg-red-950/90 border border-red-500/50 px-6 py-4 rounded-xl shadow-[0_0_30px_rgba(239,68,68,0.2)] flex items-start gap-4 w-[90%] max-w-md z-50 backdrop-blur-md";
            }
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 6000);
        }

        // Generate PDF Receipt
        function generateCitizenReceipt() {
            if(!globalReportData) return;
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(212, 175, 55);
                doc.text("RoadPulse AI Scanner", 105, 25, null, null, "center");

                doc.setFontSize(14); doc.setTextColor(0, 0, 0);
                doc.text("OFFICIAL CIVIC REPORT RECEIPT", 105, 35, null, null, "center");

                doc.setDrawColor(212, 175, 55); doc.setLineWidth(0.5); doc.line(20, 45, 190, 45);

                const latStr = userLat ? userLat.toFixed(6) : "Not Available";
                const lonStr = userLon ? userLon.toFixed(6) : "Not Available";
                const reportId = globalReportData.report_id || globalReportData.id || "101";

                doc.setFontSize(12); doc.setFont("helvetica", "normal");
                doc.text(`Tracking ID: RP-2026-CITIZEN-${reportId}`, 20, 65);
                doc.text(`Date & Time: ${new Date().toLocaleString()}`, 20, 75);
                doc.text(`GPS Coordinates: Latitude ${latStr}, Longitude ${lonStr}`, 20, 85);

                doc.setFont("helvetica", "bold"); doc.text("AI Diagnostic Results:", 20, 105);
                doc.setFont("helvetica", "normal");
                doc.text(`Total Defects Detected: ${globalReportData.total_issues_found || globalReportData.count || 1}`, 25, 115);
                doc.text(`Assigned Priority Level: ${globalReportData.priority_band || globalReportData.priority || "High"}`, 25, 125);
                doc.text(`Current System Status: Logged in Municipal Task Queue`, 25, 135);

                doc.setFont("helvetica", "italic"); doc.setFontSize(10); doc.setTextColor(100, 100, 100);
                doc.text("Disclaimer: This is an auto-generated AI receipt.", 20, 170);
                doc.text("Thank you for contributing to safer roads. The Enterprise Ops team will dispatch a", 20, 177);
                doc.text("contractor based on the assigned priority.", 20, 184);

                doc.save(`RoadPulse_Civic_Receipt_#${reportId}.pdf`);
            } catch (err) {
                alert("Sorry, could not generate PDF: " + err.message);
            }
        }

        document.getElementById('download-btn').addEventListener('click', generateCitizenReceipt);

        // Analysis Button Click Event Logic
        document.getElementById('submit-btn').addEventListener('click', async () => {
            if (!selectedFile) {
                showToast('error', 'Visual Feed Missing', 'Please select or upload a road image first.');
                return;
            }

            const btn = document.getElementById('submit-btn');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing Signal...`;
            btn.disabled = true;
            document.getElementById('download-btn').classList.add('hidden');
            lucide.createIcons();

            const formData = new FormData();
            formData.append("file", selectedFile);
            if (userLat && userLon) {
                formData.append("lat", userLat);
                formData.append("lon", userLon);
            }

            try {
                const response = await fetch(`${API_BASE}/predict`, { method: "POST", body: formData });
                const data = await response.json();
                
                console.log("Full Backend Response:", data);
                globalReportData = data; 

                imagePreview.classList.remove('hidden');
                placeholder.classList.add('hidden');

                const detections = data.detections || data.predictions || data.results || [];
                const totalIssues = data.total_issues_found !== undefined ? data.total_issues_found : detections.length;

                if (data.status === "merged") {
                    showToast('merge', 'Data Merged', `Duplicate signature detected. Combined with ID: ${data.report_id || 'N/A'}.`);
                    document.getElementById('download-btn').classList.remove('hidden'); 
                } else if (detections.length > 0) {
                    showToast('success', 'Analysis Verified', `Identified ${totalIssues} structural defect(s).`);
                    
                    canvas.classList.remove('hidden');
                    const ctx = canvas.getContext('2d');
                    const imgObj = new Image();
                    imgObj.src = imagePreview.src;
                    imgObj.onload = () => {
                        canvas.width = imagePreview.clientWidth;
                        canvas.height = imagePreview.clientHeight;
                        const scaleX = canvas.width / imgObj.naturalWidth;
                        const scaleY = canvas.height / imgObj.naturalHeight;
                        
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        detections.forEach(det => {
                            const bbox = det.bounding_box || det.box || [10, 10, 100, 100];
                            const [x1, y1, x2, y2] = bbox;
                            const damageType = det.damage_type || det.class || det.label || 'Defect';
                            const conf = det.confidence_score !== undefined ? det.confidence_score : (det.confidence || 0.95);
                            
                            ctx.strokeStyle = "#eab308"; ctx.lineWidth = 3; ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 5;
                            ctx.strokeRect(x1 * scaleX, y1 * scaleY, (x2 - x1) * scaleX, (y2 - y1) * scaleY);
                            
                            ctx.fillStyle = "rgba(234, 179, 8, 0.95)"; ctx.fillRect(x1 * scaleX, (y1 * scaleY) - 22, (x2 - x1) * scaleX, 22);
                            ctx.fillStyle = "#000"; ctx.font = "bold 11px 'Plus Jakarta Sans'"; ctx.shadowBlur = 0;
                            ctx.fillText(` ${damageType} [${(conf*100).toFixed(0)}%]`, (x1 * scaleX) + 2, (y1 * scaleY) - 6);
                        });
                    };

                    document.getElementById('download-btn').classList.remove('hidden'); 

                } else {
                    showToast('success', 'Analysis Complete', 'Visual data processed successfully.');
                    document.getElementById('download-btn').classList.remove('hidden');
                }
            } catch (err) {
                console.error("Prediction Error:", err);
                showToast('error', 'Connection Lost', 'Unable to reach the core processing server.');
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
